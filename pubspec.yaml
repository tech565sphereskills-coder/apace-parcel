name: ride
description: "Apace Parcel - Express Logistics & Digital Wallet Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.0.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
